name: Release CWB

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-cwb-main
  cancel-in-progress: false

jobs:
  release-cwb:
    name: release-cwb
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release bypass token
        env:
          CWB_RELEASE_BYPASS_TOKEN: ${{ secrets.CWB_RELEASE_BYPASS_TOKEN }}
        run: |
          if [[ -z "$CWB_RELEASE_BYPASS_TOKEN" ]]; then
            echo "::error::Set CWB_RELEASE_BYPASS_TOKEN to a token for a release actor that can bypass the main branch ruleset."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CWB_RELEASE_BYPASS_TOKEN }}
          persist-credentials: true

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh gh

      - name: Run cwb bash tests
        run: bash scripts/test_cwb.sh

      - name: Release from main
        env:
          GH_TOKEN: ${{ secrets.CWB_RELEASE_BYPASS_TOKEN }}
          HOMEBREW_TAP_PUSH_TOKEN: ${{ secrets.HOMEBREW_TAP_PUSH_TOKEN }}
          HOMEBREW_TAP_REPO: cheikhfiteni/homebrew-tap
        run: bash scripts/release_on_main.sh
